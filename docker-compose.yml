name: technitoit-vitrine

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: technitoit-vitrine:latest
    container_name: technitoit-vitrine
    restart: unless-stopped
    ports:
      # Écoute uniquement en local : le trafic public passe par le reverse proxy (nginx)
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    volumes:
      # Conserve les images optimisées entre deux redémarrages
      - next-cache:/app/.next/cache

volumes:
  next-cache:
